<div class="dashboard">

  <h2 class="dashboard-title">Admin Dashboard</h2>

  <div class="card-grid">

    <div class="card">
      <h3>Total Candidates</h3>
      <p>{{stats.total}}</p>
    </div>

    <div class="card">
      <h3>Scheduled</h3>
      <p>{{stats.scheduled}}</p>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <p>{{stats.pending}}</p>
    </div>

    <div class="card">
      <h3>Completed</h3>
      <p>{{stats.completed}}</p>
    </div>

  </div>

</div>
